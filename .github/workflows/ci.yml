name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: Test workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      - name: Failed tests
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$|^error(\[|:)" test.log | head -40 | sed 's/^/::error::/'
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The desktop shell's resources point at the built window, which is not in git.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the window for the desktop shell
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test desktop shell
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: README download tables
        run: node scripts/readme-downloads.mjs

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx vp test run
      - run: npm run build
